# Claude reviews every PR. Drop into .github/workflows/ and add
# ANTHROPIC_API_KEY to repo secrets. Uses the official action.
name: claude-pr-review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write   # comment only — the agent never pushes
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request diff for:
            1. Correctness bugs (the only category that blocks)
            2. Security issues (injection, authz gaps, secrets in code)
            3. Missing tests for changed behaviour
            Post findings as inline review comments. Be specific: file, line,
            failure scenario. If the PR is clean, say so in one comment —
            do not invent nitpicks to look busy.
          claude_args: "--max-turns 20"
